---
name: build-z88dk-docker

on:
  push:
    paths:
      - docker/Dockerfile
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # TS2-3: Build and push the :build stage (compile environment only).
      # This is the image used by build-test-games.yaml.
      - name: Build and push :build image
        uses: docker/build-push-action@v3
        with:
          context: ./docker
          file: ./docker/Dockerfile
          target: build
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/rage1-z88dk:build

      # TS2-3: Build and push the :test stage (build + Caprice32 + Xvfb +
      # ImageMagick).  Used by the regression workflow (TS3) for headless
      # CPC screenshot testing.
      - name: Build and push :test image
        uses: docker/build-push-action@v3
        with:
          context: ./docker
          file: ./docker/Dockerfile
          target: test
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/rage1-z88dk:test
