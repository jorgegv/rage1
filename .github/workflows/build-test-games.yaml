---
name: build-test-games

on:
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build-test-games:
    name: Build test games
    runs-on: ubuntu-latest
    container:
      image: zxjogv/rage1-z88dk:build
      volumes:
        - ${{ github.workspace }}:/src/rage1
    steps:

      - name: Checkout RAGE1 repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # R10: the cpctelera asset-converter install step was removed along with
      # the external/cpctelera submodule and the cpct_img2tileset converter
      # path.  CPC asset conversion is now done in-process by datagen's
      # RAGE::AssetBackend; no external host tool is needed.

      - name: Build test games
        run: |
          cd /src/rage1 && \
          make all-test-builds
