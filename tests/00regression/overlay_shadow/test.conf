# Phase A4 — sibling-tree overlay regression test.
#
# games/overlay_shadow uses the same shared game_data/ as games/minimal,
# plus a zx128/game_data/btiles/Live.gdata overlay that changes the
# Live BTile's ATTR from INK_RED to INK_YELLOW. The shared game_data/
# game_config/Game.gdata declares PLATFORM zx128, so the overlay wins
# at `make config` time and the heart drawn on Screen01 renders yellow
# instead of red. reference.png locks that visual: if the overlay copy
# mechanism ever regresses (shared file leaks through), the heart will
# go back to red and the pixel diff will fire.
TARGET_GAME=games/overlay_shadow
MACHINE=128k
DELAY_FRAMES=500
EXTRA_ARGS=""
