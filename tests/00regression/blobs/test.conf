# Test definition for games/blobs
# blobs is a 128k game with LOADING_SCREEN WAIT_ANY_KEY=1: a SPACE keypress
# at frame 700 dismisses the loading screen; the screenshot is then taken
# at frame 1000 once the menu/intro/game state is on screen.
TARGET_GAME=games/blobs
MACHINE=128k
PLATFORMS=zx128
DELAY_FRAMES=1000
EXTRA_ARGS="--delayed-keypress-frames 700 SPACE"
