# Test definition for games/minimal_cpc — first CPC regression baseline.
#
# DEVIATION (TS3 scope): the spec's TS3-3 names PLATFORMS=cpc6128, but the
# cpc6128 (cpc-banked) toolchain is Phase T3 and does not build yet.
# games/minimal_cpc builds as cpc464 / cpc-flat (G8: `make build-minimal_cpc`,
# CPC_LINK_ENGINE_FULL=1). So the first CPC baseline is cpc464; the cpc6128
# baseline follows once T3 lands.
#
# minimal_cpc runs the REAL RAGE1 engine game loop on the CPC: one screen of
# BTiles + hero + a 50Hz-ISR-driven MOVING enemy. The enemy moves frame to
# frame, so the capture frame must be deterministic. Caprice32's CAP32_DELAY
# is frame-counted (not wall-clock): the screenshot fires at a fixed emulated
# frame, so the capture is byte-reproducible run-to-run AND across rebuilds —
# verified 0 px diff over repeated captures. Hence TOLERANCE_CPC464=0.
#
# DELAY_FRAMES_CPC464 is consumed by run_emulator_cpc() as cap32
# `system.boot_time` (frames). The screenshot fires after boot wait +
# one CAP32_DELAY (~2x this value emulated frames). 300 lands well past the
# cpctelera + AMSDOS boot and after the engine has drawn the first settled
# screen.
TARGET_GAME=games/minimal_cpc
PLATFORMS=cpc464
DELAY_FRAMES_CPC464=300
TOLERANCE_CPC464=0
