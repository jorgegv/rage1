##
## Banking configuration (per-platform)
##
## Phase B1 of the cross-platform plan externalises the banking constants
## that the build tools and the engine used to hard-code. New platforms
## (e.g. CPC) add their own sub-key under `banking:`; ZX 128 keeps its
## historic values verbatim.
##
## Fields (per platform):
##   dataset_valid_banks
##     Ordered list of physical RAM banks where datasets may be placed.
##     The order encodes the storage preference used by `banktool.pl`
##     when laying out datasets (first entry tried first). For ZX 128
##     the contended banks come first so non-contended banks remain
##     available for code that benefits from no-wait-state access.
##   codeset_valid_banks
##     Ordered list of physical RAM banks where codesets may be placed.
##     Same ordering semantics as `dataset_valid_banks` but inverted:
##     non-contended banks come first because codesets execute code and
##     benefit most from being uncontended.
##   engine_code_memory_bank
##     RAM bank that holds the engine's banked-function table and the
##     engine banked code. Switched in at `swap_window` whenever the
##     trampolines in `engine/src/00lowmem.c` are entered. Must NOT
##     appear in `codeset_valid_banks` (codesets use a different bank).
##   swap_window
##     Z80 address at which the bank-switched 16K window appears. For
##     ZX 128 this is 0xC000 (the upper 16K page). The banked-function
##     table and the codeset_assets_s struct are both anchored at this
##     address.
##   bank_size
##     Size in bytes of each RAM bank. 16384 for both ZX 128 and CPC
##     6128. null for platforms with no banking (zx48, cpc-flat).
##   (cpc-flat) dataset_valid_banks / codeset_valid_banks
##     Explicit empty lists — cpc-flat has no banking, so these are
##     kept (using the canonical key names shared with zx128 and
##     cpc-banked) for structural consistency and to confirm that
##     banktool.pl skips banking-specific work for cpc-flat.
##
## B4-3: Bank-ID convention (per banking.md §3.3)
##   Bank IDs are PLATFORM-SPECIFIC. They are NOT shared between ZX
##   and CPC. ZX bank 4 ≠ CPC RAM 4 in any meaningful semantic sense.
##   The valid-banks lists are themselves per-platform:
##     zx128:    dataset_valid_banks = [1, 3, 7, 6, 4]
##     cpc-flat: no banking (null/empty)
##     cpc-banked (Phase B6): dataset_valid_banks = [5, 6, 7, 4]
##   The `engine_code_memory_bank` value coincidentally equals 4 on
##   both ZX 128 and cpc-banked (by hardware convention); this
##   coincidence is documented as incidental (see banking.md §3.3).
##
banking:
  zx128:
    dataset_valid_banks:    [ 1, 3, 7, 6, 4 ]
    codeset_valid_banks:    [ 6, 1, 3, 7 ]
    engine_code_memory_bank: 4
    swap_window:             0xC000
    bank_size:               16384

  ## cpc-flat (CPC 464/664): no banking.
  ## B5-1: mirrors the ZX 48 "banking compiles out" pattern.
  ## All banking-related fields are null/empty so banktool.pl (when
  ## called with --platform=cpc-flat) knows there is nothing to lay out.
  ## banking.md §3.1.3 is the normative memory map for this platform.
  cpc-flat:
    swap_window:              ~
    bank_size:                ~
    dataset_valid_banks:      []
    codeset_valid_banks:      []
    engine_code_memory_bank:  ~

  ## cpc-banked (CPC 6128): placeholder for Phase B6.
  ## Numbers from banking.md §3.1.4 Shape A.  banktool.pl does NOT
  ## yet process this section (Phase B7 extends banktool for CPC).
  cpc-banked:
    swap_window:             0x4000
    bank_size:               16384
    dataset_valid_banks:     [ 5, 6, 7, 4 ]
    ## engine bank 4 excluded per the "Must NOT appear in codeset_valid_banks"
    ## invariant above (mirrors zx128, whose codeset list also omits bank 4);
    ## bank 4 is reserved for engine banked code so a codeset can never start
    ## there anyway (banktool skips banks already occupied by the reserved code).
    codeset_valid_banks:     [ 5, 6, 7 ]
    engine_code_memory_bank: 4
    ## DC6 (B7 step 9.2b): cold-boot LOADER.BIN constants, read by
    ## tools/loadertool.pl --platform=cpc-banked (lifted out of the hard-coded
    ## literals it used at step 9.1).  Packaging Model 2 (design note
    ## doc/multiplatform-plan/cpc-banked-disk-loader.md §8.5): a standalone
    ## LOADER.BIN firmware-loads the headerless engine image (main_file) to
    ## main_code_start, then each per-bank file, then `jp main_code_start`.
    ##   loader_org      LOADER.BIN org (low-RAM gap below the engine image)
    ##   main_code_start engine entry / ORG; MUST equal CRT_ORG_CODE in
    ##                   Makefile-cpc-banked (Shape A = 0x1200)
    ##   main_file       filename of the headerless resident engine image
    loader:
      loader_org:            0x0100
      main_code_start:       0x1200
      main_file:             GAME.BIN

