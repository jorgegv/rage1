##
## IM2 interrupt configuration (per-platform)
##
## Phase B2 of the cross-platform plan reorganises this section under a
## nested `interrupts:` tree so other platforms (e.g. CPC) add their own
## sub-key as a sibling. ZX 128 keeps its historic values verbatim.
##
## For backwards compatibility, the legacy flat key `interrupts_128:` is
## kept as a permanent silent alias at the top level (per README §5.6).
## It is wired via a YAML anchor (&interrupts_zx128) so the two spellings
## point at the same data — readers may use either spelling indefinitely.
## No removal is scheduled.
##
## Int config is fixed for 48K mode.
##
## 257 bytes with value ISR_VECTOR_BYTE are stored at address IV_TABLE_ADDR
## ISR address is built as 2 consecutive bytes of value ISR_VECTOR_BYTE, e.g. 0x8181
## At that address there is a JP <ISR> 3-byte jump instruction to the real ISR routine.
## So the real code starts at ISR address + 3.
##

# Interrupt map — per-platform sub-keys under `interrupts:`.
# 128K: IV table, ISR and stack at bottom of upper 16 KB window.
# cpc-flat (B5-1): IM 1, ISR entry fixed at 0x0038 (RST 38).
interrupts:
  zx128: &interrupts_zx128
    iv_table_addr: 0x8000
    isr_vector_byte: 0x81
    isr_vector_address: 0x8181
    base_code_address: 0x8184

  # B5-1: cpc-flat interrupt config.
  # CPC uses IM 1 (the only standard interrupt mode on stock CPC firmware).
  # The ISR entry is at 0x0038 (RST 38 vector, hardware fixed).
  # No IM 2 vector table needed.  base_code_address = CRT_ORG_CODE =
  # 0x1200 (z88dk +cpc default; validated by Phase T2 — see
  # zpragma-cpc-flat.inc and banking.md §3.1.3 B4-1 reconciliation).
  # iv_table_addr and isr_vector_byte are ZX 128 / IM 2 specific; null
  # on all CPC profiles (cpc-flat and cpc-banked share IM 1).
  cpc-flat:
    iv_table_addr:      ~
    isr_vector_byte:    ~
    isr_vector_address: 0x0038
    base_code_address:  0x1200

# Legacy flat alias — permanent (README §5.6). All existing tools that
# read `interrupts_128:` keep working unchanged.
interrupts_128: *interrupts_zx128

#
# alternative map with IV at 0x8400, ISR at 0x8585 and code starting at 0x8588
#
#interrupts:
#  zx128: &interrupts_zx128
#    iv_table_addr: 0x8400
#    isr_vector_byte: 0x85
#    isr_vector_address: 0x8585
#    base_code_address: 0x8588
#interrupts_128: *interrupts_zx128

##
## banked functions database
##
## Fields:
##   name (mandatory)
##   signature (optional): a16, a16_r8, etc.
##   build_dependency (optional): BUILD_FEATURE_xx
##
## Definitions for the given functions will only be output if
## BUILD_FEATURE_xx is enabled in features.h, or no build_dependency is
## present
##
## See doc/BANKED-FUNCTIONS.md for details
##
banked_functions:

  # init_main_shared_data
  - name: init_main_shared_data
    signature: a16

  # beeper (audio SFX backend: zx_beeper)
  #
  # AU3-6 note: these banked-function `name`s are the *implementation*
  # symbols exported by engine/banked_code/common/audio_zx_beeper.c and are
  # also used to generate the call-shim macros (#define beeper_play_fx(a)
  # ...). The audio_* HAL surface reaches them via the AU2-2 `static inline`
  # redirects (audio_sfx_beeper_play -> beeper_play_fx). Because AU3-7 was
  # DROPPED (README §5.6 — the audio_* inline aliases stay forever), renaming
  # these entries to the audio_* names would clash with those same-named
  # inline functions. They therefore keep the legacy implementation-symbol
  # names; the audio_* names live one layer up in the HAL headers.
  - name: beeper_play_pending_fx
  - name: beeper_request_fx
    signature: a16
  - name: init_beeper
  - name: beeper_play_fx
    signature: a16

  # animation
  - name: animation_sequence_tick
    signature: a16_a8_r8
  - name: animation_reset_state
    signature: a16

  # hero
  - name: hero_animate_and_move

  # enemy
  - name: enemy_animate_and_move_all

  # bullet
  - name: bullet_animate_and_move_all
    build_dependency: BUILD_FEATURE_HERO_HAS_WEAPON
  - name: bullet_add
    build_dependency: BUILD_FEATURE_HERO_HAS_WEAPON

  # tracker (audio music + AY SFX backend: zx_ay)
  #
  # AU3-6 note: same rationale as the beeper block above. These are the
  # implementation symbols in engine/banked_code/128/audio_zx_ay.c; the
  # audio_music_* / audio_sfx_tracker_* HAL aliases redirect to them. They
  # keep their legacy names to avoid clashing with the kept AU2-2 inline
  # aliases (AU3-7 dropped). build_dependency is left on the legacy
  # BUILD_FEATURE_TRACKER* macros, which datagen still emits in parallel with
  # the new BUILD_FEATURE_AUDIO_* family (so external configs are unaffected).
  - name: init_tracker
    build_dependency: BUILD_FEATURE_TRACKER
  - name: tracker_select_song
    signature: a16
    build_dependency: BUILD_FEATURE_TRACKER
  - name: tracker_start
    build_dependency: BUILD_FEATURE_TRACKER
  - name: tracker_stop
    build_dependency: BUILD_FEATURE_TRACKER
  - name: tracker_do_periodic_tasks
    build_dependency: BUILD_FEATURE_TRACKER
  - name: init_tracker_sound_effects
    build_dependency: BUILD_FEATURE_TRACKER_SOUNDFX
  - name: tracker_play_fx
    signature: a16
    build_dependency: BUILD_FEATURE_TRACKER_SOUNDFX
  - name: tracker_rewind
    build_dependency: BUILD_FEATURE_TRACKER
  - name: tracker_play_pending_fx
    build_dependency: BUILD_FEATURE_TRACKER_SOUNDFX
  - name: tracker_request_fx
    signature: a16
    build_dependency: BUILD_FEATURE_TRACKER_SOUNDFX
